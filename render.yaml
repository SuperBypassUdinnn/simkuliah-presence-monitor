services:
  - type: web
    name: simkuliah-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SIMKULIAH_NPM
        sync: false
      - key: SIMKULIAH_PASSWORD
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: ACTION_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://ftznonanlbshweysliar.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SIMKULIAH_API_BASE_URL
        fromService:
          type: web
          name: simkuliah-backend
          property: host
