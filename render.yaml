# Render Blueprint for the Simkuliah backend.
#
# ALL configuration lives in ONE secret file instead of per-variable
# environment entries:
#
#   Dashboard -> simkuliah-backend -> Environment -> Secret Files
#   Filename:  .env
#   Contents:  fill in backend/.env.example and paste it here
#
# The file is mounted at /etc/secrets/.env and auto-detected at startup
# (see backend/app/config.py), so no envVars block is needed below. Rotate or
# change configuration by editing the secret file contents only.
services:
  - type: web
    name: simkuliah-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
