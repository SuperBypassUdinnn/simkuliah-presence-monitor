[project]
name = "simkuliah-backend"
version = "0.1.0"
description = "Simkuliah Multi-Platform Presence Monitor backend daemon"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
