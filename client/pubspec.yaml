name: simkuliah_client
description: Multi-platform Flutter client for the Simkuliah presence monitor.
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  http: ^1.6.0
  supabase_flutter: ^2.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
