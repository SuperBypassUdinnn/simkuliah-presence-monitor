name: CI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Lint, Test, & Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r backend/requirements.txt
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Run Quality Verification Pipeline
        run: python3 scripts/verify_pipeline.py
      - name: Verify Planning & Backlog Parity
        run: python3 scripts/sync_backlog_status.py --check
